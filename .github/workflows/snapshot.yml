name: data snapshot
on:
  schedule:
    - cron: "17 6 2 * *"   # 06:17 UTC on the 2nd of each month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python src/download_data.py
      - run: python src/snapshot.py
      - name: Commit the snapshot
        run: |
          git config user.name "Doraaadorable"
          git config user.email "Doraaadorable@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Add data snapshot"
          git push
